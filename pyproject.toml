[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "itools"
version = "0.1.0"
description = "Extensible internal service CLI, starting with Jira WBS Excel imports"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "itools contributors" }]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<16",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
itools = "itools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/itools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
